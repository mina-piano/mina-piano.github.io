<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>mina piano リズムゲーム</title>
<meta property="og:title" content="mina piano リズムゲーム / Rhythm Game">
<meta property="og:image" content="https://mina-piano.github.io/header.jpg">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#1d0b17;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;overflow:hidden;overscroll-behavior:none}
body{display:flex;justify-content:center}
.stage{position:relative;width:min(100vw,520px);height:100vh;height:100dvh;background:linear-gradient(180deg,rgba(40,14,32,.82),rgba(29,11,23,.94)),url(header.jpg) 38% center/cover no-repeat,#1d0b17;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:18px 16px;overflow-y:auto;touch-action:pan-y}
.screen.on{display:flex}
h1{margin:6px 0 4px;font-size:1.7rem;color:#fff;text-align:center;text-shadow:0 0 14px #ff8fb8,0 2px 6px rgba(0,0,0,.6);letter-spacing:.06em}
h1::before{content:'♪ ';color:#ffb3d1}h1::after{content:' ♪';color:#ffb3d1}
.sub{text-align:center;color:#d9a9bf;font-size:.9rem;margin:0 0 14px}
h2{font-size:1rem;color:#ffb3d1;margin:16px 0 8px}
.list button,.row button,.big{backdrop-filter:blur(4px);font:inherit;color:#fff;border:2px solid #e0709f;background:rgba(224,112,159,.15);border-radius:14px;padding:12px 14px;margin:0 0 8px;width:100%;text-align:left;cursor:pointer}
.list button.sel,.row button.sel{background:#e0709f;color:#fff;font-weight:700}
.row{display:flex;gap:8px}
.row button{text-align:center;padding:12px 6px}
.big{background:#e0709f;font-weight:700;text-align:center;font-size:1.15rem;padding:16px;margin-top:14px}
.big.alt{background:transparent}
.hint{color:#d9a9bf;font-size:.85rem;line-height:1.6;margin:8px 0}
.off{display:flex;align-items:center;gap:10px;color:#d9a9bf;font-size:.9rem}
.off button{font:inherit;color:#fff;border:2px solid #e0709f;background:rgba(224,112,159,.15);border-radius:14px;width:48px;padding:8px;margin:0;text-align:center;font-weight:700;cursor:pointer}
.off b{min-width:70px;text-align:center;color:#fff}
a.home{color:#ffb3d1;text-align:center;display:block;margin-top:18px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#quit{position:absolute;top:10px;left:10px;z-index:3;border:2px solid #ffffff88;background:#00000055;color:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem}
#fish{position:absolute;top:48px;left:10px;z-index:3;border:2px solid #ffffff88;background:#00000055;color:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem}
#fish.off{opacity:.4}
#lt{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;font-size:1.1rem;padding:20px}
.res{text-align:center}
.res .rank{font-size:6rem;font-weight:800;color:#fff;line-height:1.1;text-shadow:0 0 22px #ff8fb8,0 0 50px #e0709f}
.res .sc{font-size:2.4rem;font-weight:700}
.res .st{color:#d9a9bf;line-height:1.9;margin:8px 0}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="screen on" id="menu">
    <h1 data-t="title"></h1>
    <p class="sub" data-t="sub"></p>
    <h2 data-t="hSong"></h2>
    <div class="list" id="songs"></div>
    <h2 data-t="hDiff"></h2>
    <div class="row" id="diffs"></div>
    <h2 data-t="hOff"></h2>
    <div class="off"><button type="button" id="offm">−</button><b id="offv">0 ms</b><button type="button" id="offp">+</button></div>
    <p class="hint" data-t="offHint"></p>
    <button class="big" id="start" type="button" data-t="start"></button>
    <p class="hint" data-t="how"></p>
    <p class="hint" data-t="catHow"></p>
    <p class="hint" data-t="mute"></p>
    <a class="home" href="./" data-t="home"></a>
  </div>
  <div class="screen" id="loadscr"><div id="lt" style="display:flex"></div></div>
  <div class="screen" id="play" style="padding:0">
    <canvas id="cv"></canvas>
    <button id="quit" type="button" data-t="quit"></button>
    <button id="fish" type="button">🐟</button>
  </div>
  <div class="screen" id="result">
    <div class="res" style="margin:auto 0">
      <div class="st" id="rsong"></div>
      <div class="rank" id="rrank"></div>
      <div class="sc" id="rscore"></div>
      <div class="st" id="rstat"></div>
      <button class="big" id="again" type="button" data-t="again"></button>
      <button class="big alt" id="tomenu" type="button" data-t="toMenu"></button>
    </div>
  </div>
</div>
<script>
(function(){
  var T={
    ja:{title:'リズムゲーム',sub:'曲に合わせて、流れてくる音符をタップ!',hSong:'曲をえらぶ',hDiff:'むずかしさ',hOff:'音のずれ調整',
        offHint:'ふつうは 0 のままでOK。Bluetoothイヤホンなどで音がおくれて聞こえるときは、+ にしてください。',
        start:'スタート',how:'あそびかた:音符が下の線に重なったら、そのレーンをタップします。パソコンは D F J K キーでも遊べます。',
        mute:'iPhoneは、マナーモード(横のスイッチ)を解除すると、音が出ます。',home:'← ホームページへもどる',
        quit:'やめる',again:'もういちど',toMenu:'曲をえらびなおす',easy:'かんたん',normal:'ふつう',hard:'むずかしい',
        building:'譜面を作っています…',loading:'曲を読みこんでいます…',err:'読みこめませんでした。もういちどお試しください。',
        none:'曲が準備中です',perfect:'PERFECT',good:'GOOD',miss:'MISS',combo:'コンボ',score:'スコア',
        catHow:'ゲーム中、飼い猫のMiaちゃんが邪魔しにくることがあります。のぞいているうちに、音符のないタイミングでそのレーンをタップしてなでなでするか、🐟ボタンでごはんを出すと、上へ連れていけます。ほうっておくと、レーンに座りこんで、タップできなくなります。',catPeek:'Miaちゃんがのぞいてる! タップでなでなで',catBlock:'Miaが邪魔してる! なでなで連打(🐟でもOK)',catHappy:'なでなで成功! ごろごろ♪',catBonus:'なでなでボーナス!',catLure:'ごはんで連れていったよ',rPets:'Miaをなでた回数',rPerfect:'パーフェクト',rGood:'グッド',rMiss:'ミス',rCombo:'最大コンボ',best:'ハイスコア',notes:'音符'},
    en:{title:'Rhythm Game',sub:'Tap the notes in time with the music!',hSong:'Choose a song',hDiff:'Difficulty',hOff:'Audio offset',
        offHint:'Keep it at 0 normally. If the sound arrives late (e.g. Bluetooth earphones), raise it with +.',
        start:'Start',how:'How to play: tap the lane when a note reaches the line at the bottom. On a computer you can also use the D F J K keys.',
        mute:'On iPhone, turn off silent mode (the side switch) to hear the sound.',home:'← Back to the homepage',
        quit:'Quit',again:'Play again',toMenu:'Choose another song',easy:'Easy',normal:'Normal',hard:'Hard',
        building:'Creating the chart…',loading:'Loading the song…',err:'Could not load the song. Please try again.',
        none:'Songs are coming soon',perfect:'PERFECT',good:'GOOD',miss:'MISS',combo:'Combo',score:'Score',
        catHow:'During the game your cat Mia may come to get in the way. While she is peeking, tap her lane at a moment with no note to pet her, or press the 🐟 button to lead her away with food. If you ignore her she sits on the lanes and blocks your taps.',catPeek:'Mia is peeking! Tap to pet her',catBlock:'Mia is in the way! Tap to pet her (or use the fish)',catHappy:'Purr purr ♪',catBonus:'Petting bonus!',catLure:'Mia followed the fish',rPets:'Times you petted Mia',rPerfect:'Perfect',rGood:'Good',rMiss:'Miss',rCombo:'Max combo',best:'Best',notes:'notes'}
  };
  var lang='ja';
  try{
    var q=/[?&]lang=(en|ja)/.exec(location.search),sv=null;
    try{sv=localStorage.getItem('mina-lang');}catch(e){}
    if(q)lang=q[1];else if(sv==='en'||sv==='ja')lang=sv;
    else if(navigator.language&&navigator.language.toLowerCase().indexOf('ja')!==0)lang='en';
  }catch(e){}
  function t(k){return T[lang][k];}
  function pick(ja,en){return (lang==='en'&&en)?en:ja;}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function okPath(p){return /^[A-Za-z0-9_\-\/\.]+$/.test(p)&&p.indexOf('..')<0;}
  function $(id){return document.getElementById(id);}
  function show(id){['menu','loadscr','play','result'].forEach(function(s){$(s).classList.toggle('on',s===id);});}
  function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}

  var songs=[],sel=0,diff='normal',offMs=parseInt(store('mina-off')||'0',10)||0;
  var DIFF={easy:{mult:1.9,gap:.55,fall:1.9},normal:{mult:1.45,gap:.32,fall:1.55},hard:{mult:1.15,gap:.19,fall:1.25}};

  function applyText(){
    document.documentElement.lang=lang;document.title=lang==='en'?'mina piano Rhythm Game':'mina piano リズムゲーム';
    document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.getAttribute('data-t'));});
    renderMenu();
  }
  function renderMenu(){
    var box=$('songs');
    if(!songs.length){box.innerHTML='<p class="hint">'+t('none')+'</p>';}
    else box.innerHTML=songs.map(function(s,i){return '<button type="button" data-i="'+i+'" class="'+(i===sel?'sel':'')+'">'+esc(pick(s.ja,s.en))+'</button>';}).join('');
    box.querySelectorAll('button').forEach(function(b){b.onclick=function(){sel=+b.getAttribute('data-i');renderMenu();};});
    $('diffs').innerHTML=['easy','normal','hard'].map(function(d){return '<button type="button" data-d="'+d+'" class="'+(d===diff?'sel':'')+'">'+t(d)+'</button>';}).join('');
    $('diffs').querySelectorAll('button').forEach(function(b){b.onclick=function(){diff=b.getAttribute('data-d');renderMenu();};});
    $('offv').textContent=(offMs>0?'+':'')+offMs+' ms';
  }
  $('offm').onclick=function(){offMs=Math.max(-300,offMs-20);store('mina-off',String(offMs));renderMenu();};
  $('offp').onclick=function(){offMs=Math.min(300,offMs+20);store('mina-off',String(offMs));renderMenu();};

  fetch('songs.txt?t='+Date.now()).then(function(r){return r.ok?r.text():'';}).catch(function(){return '';}).then(function(txt){
    songs=txt.split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return s&&s.charAt(0)!=='#';}).map(function(s){return s.split('|').map(function(x){return x.trim();});})
      .filter(function(r){return r[0]&&r[1]&&okPath(r[1]);}).map(function(r){return {ja:r[0],file:r[1],en:r[4]};});
    applyText();
  });
  applyText();

  /* ---------- 譜面づくり ---------- */
  function fft(re,im){
    var n=re.length,i,j=0,k,m;
    for(i=0;i<n-1;i++){if(i<j){var a=re[i];re[i]=re[j];re[j]=a;a=im[i];im[i]=im[j];im[j]=a;}k=n>>1;while(k<=j){j-=k;k>>=1;}j+=k;}
    for(var len=2;len<=n;len<<=1){
      var ang=-2*Math.PI/len,wr=Math.cos(ang),wi=Math.sin(ang),h=len>>1;
      for(i=0;i<n;i+=len){var cr=1,ci=0;
        for(m=0;m<h;m++){
          var ur=re[i+m],ui=im[i+m],vr=re[i+m+h]*cr-im[i+m+h]*ci,vi=re[i+m+h]*ci+im[i+m+h]*cr;
          re[i+m]=ur+vr;im[i+m]=ui+vi;re[i+m+h]=ur-vr;im[i+m+h]=ui-vi;
          var nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr;
        }}
    }
  }
  function buildChart(buf,dname,onProg){
    return new Promise(function(resolve){
      var N=1024,HOP=1024,sr=buf.sampleRate,ch0=buf.getChannelData(0),ch1=buf.numberOfChannels>1?buf.getChannelData(1):null;
      var frames=Math.floor((ch0.length-N)/HOP),B=240;
      var win=new Float32Array(N);for(var i=0;i<N;i++)win[i]=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
      var re=new Float32Array(N),im=new Float32Array(N),prev=new Float32Array(B),flux=new Float32Array(frames),cen=new Float32Array(frames);
      var f=0;
      function step(){
        var end=Math.min(frames,f+1500);
        for(;f<end;f++){
          var off=f*HOP;
          for(var i=0;i<N;i++){var v=ch1?(ch0[off+i]+ch1[off+i])*.5:ch0[off+i];re[i]=v*win[i];im[i]=0;}
          fft(re,im);
          var fl=0,sm=0,sw=0;
          for(var b=1;b<B;b++){
            var mag=Math.sqrt(re[b]*re[b]+im[b]*im[b]),lm=Math.log(1+mag*4),d=lm-prev[b];
            if(d>0)fl+=d;prev[b]=lm;sm+=mag;sw+=mag*b;
          }
          flux[f]=fl;cen[f]=sm>0?sw/sm:0;
        }
        if(onProg)onProg(f/frames);
        if(f<frames){setTimeout(step,0);}else{resolve(pickNotes(flux,cen,frames,HOP,sr,dname));}
      }
      step();
    });
  }
  function pickNotes(flux,cen,frames,HOP,sr,dname){
    var D=DIFF[dname],gm=0,i,j;
    for(i=0;i<frames;i++)gm+=flux[i];gm/=Math.max(1,frames);
    var W=8,cand=[];
    for(i=3;i<frames-3;i++){
      var s=0,c=0;for(j=Math.max(0,i-W);j<=Math.min(frames-1,i+W);j++){s+=flux[j];c++;}
      var thr=(s/c)*D.mult+gm*0.35;
      var v=flux[i];
      if(v>thr&&v>=flux[i-1]&&v>=flux[i+1]&&v>=flux[i-2]&&v>=flux[i+2]){
        cand.push({t:(i*HOP+HOP/2)/sr,v:v,c:cen[i]});
      }
    }
    var out=[];
    cand.forEach(function(n){
      if(n.t<1.4)return;
      var last=out[out.length-1];
      if(last&&n.t-last.t<D.gap){if(n.v>last.v)out[out.length-1]=n;}else out.push(n);
    });
    var cs=out.map(function(n){return n.c;}).sort(function(a,b){return a-b;});
    var q1=cs[Math.floor(cs.length*.25)]||0,q2=cs[Math.floor(cs.length*.5)]||0,q3=cs[Math.floor(cs.length*.75)]||0;
    var l1=-1,l2=-1;
    return out.map(function(n){
      var lane=n.c<q1?0:n.c<q2?1:n.c<q3?2:3;
      if(lane===l1&&lane===l2){lane=lane<=1?lane+1:lane-1;}
      l2=l1;l1=lane;
      return {t:n.t,lane:lane,done:false};
    });
  }

  /* ---------- ゲーム ---------- */
  var ctx=null,src=null,raf=0,notes=[],startAt=0,dur=0,running=false,cur=null;
  var st={score:0,earned:0,combo:0,maxc:0,perf:0,good:0,miss:0};
  var pops=[],flashes=[0,0,0,0],cv=$('cv'),g=cv.getContext('2d'),W=0,H=0,dpr=1;
  var COLORS=['#ff8fb8','#ffb86b','#8fe0ff','#c9a0ff'],KEYS={d:0,f:1,j:2,k:3};

  function resize(){
    var r=$('stage').getBoundingClientRect();dpr=window.devicePixelRatio||1;
    W=r.width;H=r.height;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);g.setTransform(dpr,0,0,dpr,0,0);
  }
  window.addEventListener('resize',resize);

  function gt(){return ctx.currentTime-startAt;}
  function judgeTime(){return gt()-offMs/1000;}

  function tap(lane){
    if(!running)return;
    flashes[lane]=1;
    if(cat&&cat.state==='block'&&lane>=cat.lane&&lane<=cat.lane+1){petCat();return;}
    var tm=judgeTime(),best=null,bd=1;
    for(var i=0;i<notes.length;i++){
      var n=notes[i];if(n.done||n.lane!==lane)continue;
      var d=Math.abs(n.t-tm);if(n.t-tm>.3)break;
      if(d<bd){bd=d;best=n;}
    }
    if(!best||bd>.16){if(cat&&cat.state==='peek'&&lane>=cat.lane&&lane<=cat.lane+1)petCat();return;}
    best.done=true;
    if(bd<=.075){st.perf++;st.earned+=1;pop('perfect',lane);burst(lane,28,true);}else{st.good++;st.earned+=.6;pop('good',lane);burst(lane,14,false);}
    st.combo++;comboT=performance.now();pulse=1;if(st.combo>st.maxc)st.maxc=st.combo;
  }
  var parts=[],rings=[],petals=[],pulse=0,comboT=0,bgimg=new Image(),bgok=false;
  bgimg.onload=function(){bgok=true;};bgimg.src='header.jpg';
  for(var pi=0;pi<26;pi++)petals.push({x:Math.random(),y:Math.random(),s:3+Math.random()*5,vy:.03+Math.random()*.07,vx:(Math.random()-.5)*.03,r:Math.random()*6,sp:(Math.random()-.5)*.03,a:.25+Math.random()*.4});
  function burst(lane,n,big){
    var laneW=W/4,x=lane*laneW+laneW/2,y=H*.8,c=COLORS[lane];
    rings.push({x:x,y:y,t:performance.now(),c:c,big:big});
    for(var i=0;i<n;i++){var a=-Math.PI*(.05+Math.random()*.9),v=1.5+Math.random()*(big?5:3);
      parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:Math.random()<.4?'#ffffff':c,r:1.5+Math.random()*(big?3.2:2)});}
    if(parts.length>160)parts.splice(0,parts.length-160);
  }
  function pop(kind,lane){pops.push({k:kind,l:lane,t:performance.now()});}

  function begin(){
    if(!songs.length)return;
    cur=songs[sel];
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!ctx)ctx=new AC();
    try{ctx.resume();}catch(e){}
    show('loadscr');var lt=$('lt');lt.style.display='flex';lt.textContent=t('loading');
    fetch(cur.file).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer();})
    .then(function(ab){return new Promise(function(res,rej){ctx.decodeAudioData(ab,res,rej);});})
    .then(function(buf){
      lt.textContent=t('building')+' 0%';
      return buildChart(buf,diff,function(p){lt.textContent=t('building')+' '+Math.round(p*100)+'%';}).then(function(ch){return {buf:buf,ch:ch};});
    })
    .then(function(o){play(o.buf,o.ch);})
    .catch(function(e){lt.textContent=t('err');setTimeout(function(){show('menu');},1800);});
  }
  function play(buf,chart){
    notes=chart;dur=buf.duration;st={score:0,earned:0,combo:0,maxc:0,perf:0,good:0,miss:0};pops=[];flashes=[0,0,0,0];parts=[];rings=[];pulse=0;comboT=0;
    cat=null;hearts=[];msgO=null;petTotal=0;lastLane=-1;fishLeft=CAT[diff].fish;nextCat=CAT[diff].first+Math.random()*6;fishBtn();
    show('play');resize();
    src=ctx.createBufferSource();src.buffer=buf;src.connect(ctx.destination);
    startAt=ctx.currentTime+2.2;src.start(startAt);running=true;
    cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
    window.__mina={notes:notes,gt:gt,tap:tap,st:st,spawnCat:spawnCat,useFish:useFish,petCat:petCat,getCat:function(){return cat;},getPets:function(){return petTotal;}};
  }
  function stop(){
    running=false;cancelAnimationFrame(raf);cat=null;
    try{if(src){src.onended=null;src.stop();}}catch(e){}
    src=null;
  }
  function finish(){
    stop();
    var total=notes.length||1,acc=Math.min(1,st.earned/total),score=Math.round(acc*1000000);
    var rank=acc>=.95?'S':acc>=.85?'A':acc>=.7?'B':'C';
    var key='mina-best-'+cur.file+'-'+diff,bs=parseInt(store(key)||'0',10)||0;
    if(score>bs){bs=score;store(key,String(bs));}
    $('rsong').textContent=pick(cur.ja,cur.en)+' / '+t(diff);
    $('rrank').textContent=rank;
    $('rscore').textContent=score.toLocaleString();
    $('rstat').innerHTML=t('rPerfect')+' '+st.perf+'　'+t('rGood')+' '+st.good+'　'+t('rMiss')+' '+st.miss+'<br>'+t('rCombo')+' '+st.maxc+' / '+notes.length+' '+t('notes')+'<br>'+t('rPets')+' '+petTotal+'<br>'+t('best')+' '+bs.toLocaleString();
    show('result');
  }

  /* ---------- Miaちゃん ---------- */
  var CAT={easy:{first:16,gap:[38,52],peek:3.4,peekNeed:2,block:4,blockNeed:4,fish:3},
           normal:{first:14,gap:[26,38],peek:2.8,peekNeed:3,block:5.5,blockNeed:6,fish:3},
           hard:{first:12,gap:[18,28],peek:2.2,peekNeed:3,block:6.5,blockNeed:8,fish:2}};
  var cat=null,nextCat=0,fishLeft=0,petTotal=0,hearts=[],msgO=null,lastPet=0,lastLane=-1;
  function rnd(a,b){return a+Math.random()*(b-a);}
  function ease(x){x=Math.max(0,Math.min(1,x));return 1-Math.pow(1-x,3);}
  function setMsg(k){msgO={k:k,t:performance.now()};}
  function fishBtn(){var b=$('fish');b.textContent='🐟 ×'+fishLeft;b.className=fishLeft>0?'':'off';}
  function meow(){
    try{
      var c=ctx,t0=c.currentTime,o=c.createOscillator(),f=c.createBiquadFilter(),gn=c.createGain();
      o.type='sawtooth';o.frequency.setValueAtTime(520,t0);o.frequency.linearRampToValueAtTime(860,t0+.16);o.frequency.linearRampToValueAtTime(480,t0+.5);
      f.type='bandpass';f.frequency.setValueAtTime(900,t0);f.frequency.linearRampToValueAtTime(1700,t0+.2);f.frequency.linearRampToValueAtTime(800,t0+.5);f.Q.value=3;
      gn.gain.setValueAtTime(0,t0);gn.gain.linearRampToValueAtTime(.09,t0+.06);gn.gain.linearRampToValueAtTime(0,t0+.52);
      o.connect(f);f.connect(gn);gn.connect(c.destination);o.start(t0);o.stop(t0+.55);
    }catch(e){}
  }
  function spawnCat(kind){
    var lane;do{lane=Math.floor(Math.random()*3);}while(lane===lastLane);lastLane=lane;
    cat={state:'peek',form:kind||(Math.random()<.5?'head':'tail'),lane:lane,t0:gt(),pets:0};
    setMsg('catPeek');meow();
  }
  function endCat(now){cat=null;nextCat=now+rnd(CAT[diff].gap[0],CAT[diff].gap[1]);}
  function petCat(){
    if(!cat||(cat.state!=='peek'&&cat.state!=='block'))return;
    var C=CAT[diff],laneW=W/4,now=gt();
    cat.pets++;petTotal++;lastPet=performance.now();
    hearts.push({x:(cat.lane+1)*laneW+rnd(-30,30),y:H*(cat.state==='block'?.78:.9),t:performance.now()});
    var need=cat.state==='peek'?C.peekNeed:C.blockNeed;
    if(cat.pets>=need){
      var wasPeek=cat.state==='peek';
      if(wasPeek){st.earned+=2;setMsg('catBonus');}else setMsg('catHappy');
      cat.state='happy';cat.t0=now;
    }
  }
  function useFish(){
    if(!running||!cat||fishLeft<=0)return;
    if(cat.state!=='peek'&&cat.state!=='block')return;
    fishLeft--;fishBtn();
    cat.form=(cat.state==='block')?'sit':'head';cat.state='lure';cat.t0=gt();setMsg('catLure');
  }
  function updateCat(now){
    var C=CAT[diff];
    if(!cat){if(now>0&&now>=nextCat&&now<dur-9)spawnCat();return;}
    var el=now-cat.t0;
    if(cat.state==='peek'){if(el>=C.peek){cat.state='block';cat.form='sit';cat.t0=now;cat.pets=0;setMsg('catBlock');meow();}}
    else if(cat.state==='block'){if(el>=C.block){cat.state='leave';cat.t0=now;}}
    else if(cat.state==='happy'){if(el>=.9){cat.state='leave';cat.t0=now;}}
    else if(cat.state==='lure'){if(el>=1.5)endCat(now);}
    else if(cat.state==='leave'){if(el>=.6)endCat(now);}
  }
  function drawCatHead(x,y,s,happy){
    g.save();g.translate(x,y);g.scale(s,s);
    g.lineJoin='round';g.lineWidth=2.5;g.strokeStyle='#d9bba8';
    [-1,1].forEach(function(d){
      g.fillStyle=d<0?'#c98d5a':'#fff6f0';
      g.beginPath();g.moveTo(d*46,-16);g.lineTo(d*40,-66);g.lineTo(d*10,-42);g.closePath();g.fill();g.stroke();
      g.fillStyle='#ffb9c9';g.beginPath();g.moveTo(d*38,-26);g.lineTo(d*35,-52);g.lineTo(d*18,-40);g.closePath();g.fill();
    });
    g.fillStyle='#fff6f0';g.beginPath();g.arc(0,0,50,0,7);g.fill();g.stroke();
    g.save();g.beginPath();g.arc(0,0,49,0,7);g.clip();
    g.fillStyle='#c98d5a';g.beginPath();g.ellipse(-26,-16,30,30,0,0,7);g.fill();
    g.beginPath();g.ellipse(34,-44,20,16,0,0,7);g.fill();
    g.restore();
    g.strokeStyle='#8a5a36';g.lineWidth=3;g.lineCap='round';
    [-9,0,9].forEach(function(dx){g.beginPath();g.moveTo(dx,-48);g.lineTo(dx*.8,-34);g.stroke();});
    g.strokeStyle='#3a2a33';g.fillStyle='#3a2a33';
    [-19,19].forEach(function(ex){
      if(happy){g.lineWidth=4;g.beginPath();g.arc(ex,0,9,Math.PI*1.12,Math.PI*1.88);g.stroke();}
      else{g.beginPath();g.ellipse(ex,-2,7,10,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(ex+2,-6,3,0,7);g.fill();g.fillStyle='#3a2a33';}
    });
    g.fillStyle='rgba(255,140,170,.4)';g.beginPath();g.arc(-33,14,9,0,7);g.arc(33,14,9,0,7);g.fill();
    g.fillStyle='#ff8fa8';g.beginPath();g.moveTo(-6,12);g.lineTo(6,12);g.lineTo(0,19);g.closePath();g.fill();
    g.strokeStyle='#3a2a33';g.lineWidth=2.2;g.beginPath();g.moveTo(0,19);g.lineTo(0,23);g.stroke();
    g.beginPath();g.arc(-6,23,6,0,Math.PI*.9);g.stroke();g.beginPath();g.arc(6,23,6,Math.PI*.1,Math.PI);g.stroke();
    g.strokeStyle='rgba(120,100,100,.7)';g.lineWidth=1.6;
    [-1,1].forEach(function(d){g.beginPath();g.moveTo(d*30,14);g.lineTo(d*66,6);g.stroke();g.beginPath();g.moveTo(d*30,19);g.lineTo(d*66,23);g.stroke();});
    g.restore();
  }
  function drawBow(x,y){
    g.fillStyle='#a01d3a';g.strokeStyle='#6d1226';g.lineWidth=2;
    [-1,1].forEach(function(d){g.beginPath();g.moveTo(x,y);g.lineTo(x+d*26,y-14);g.lineTo(x+d*26,y+14);g.closePath();g.fill();g.stroke();});
    g.fillStyle='#ffd45e';g.beginPath();g.arc(x,y,7,0,7);g.fill();g.stroke();
  }
  function drawCatSit(x,baseY,s,happy,squish){
    g.save();g.translate(x,baseY);g.scale(s,s*squish);
    g.lineJoin='round';g.lineCap='round';
    g.strokeStyle='#8a5a36';g.lineWidth=24;g.beginPath();g.moveTo(66,-18);g.bezierCurveTo(118,-22,122,-92,84,-104);g.stroke();
    g.strokeStyle='#c98d5a';g.lineWidth=18;g.beginPath();g.moveTo(66,-18);g.bezierCurveTo(118,-22,122,-92,84,-104);g.stroke();
    g.fillStyle='#fff6f0';g.strokeStyle='#d9bba8';g.lineWidth=2.5;
    g.beginPath();g.ellipse(0,-60,80,62,0,0,7);g.fill();g.stroke();
    g.save();g.beginPath();g.ellipse(0,-60,79,61,0,0,7);g.clip();
    g.fillStyle='#c98d5a';g.beginPath();g.ellipse(46,-74,40,44,0,0,7);g.fill();
    g.beginPath();g.ellipse(-70,-30,26,30,0,0,7);g.fill();
    g.restore();
    g.fillStyle='#fff6f0';g.strokeStyle='#d9bba8';
    [-30,30].forEach(function(px){g.beginPath();g.ellipse(px,-9,23,14,0,0,7);g.fill();g.stroke();});
    drawCatHead(0,-118,1,happy);
    drawBow(0,-68);
    g.restore();
  }
  function drawTail(x,y,s,t){
    var pts=[],i;
    for(i=0;i<=18;i++)pts.push([x+Math.sin(t*5+i*.5)*16*s*(.3+i/18),y-i*6.5*s]);
    function path(){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(var k=1;k<pts.length;k++)g.lineTo(pts[k][0],pts[k][1]);}
    g.lineCap='round';g.lineJoin='round';
    g.strokeStyle='#8a5a36';g.lineWidth=24*s;path();g.stroke();
    g.strokeStyle='#c98d5a';g.lineWidth=18*s;path();g.stroke();
    g.strokeStyle='#8a5a36';g.lineWidth=3*s;
    for(i=4;i<17;i+=4){g.beginPath();g.moveTo(pts[i][0]-8*s,pts[i][1]);g.lineTo(pts[i][0]+8*s,pts[i][1]);g.stroke();}
    g.fillStyle='#fff6f0';g.beginPath();g.arc(pts[18][0],pts[18][1],10*s,0,7);g.fill();
  }
  function drawFish(x,y,s){
    g.save();g.translate(x,y);g.scale(s,s);
    g.fillStyle='#8fe0ff';g.strokeStyle='#fff';g.lineWidth=2.5;
    g.beginPath();g.ellipse(0,0,30,15,0,0,7);g.fill();g.stroke();
    g.beginPath();g.moveTo(26,0);g.lineTo(46,-14);g.lineTo(46,14);g.closePath();g.fill();g.stroke();
    g.fillStyle='#1d0b17';g.beginPath();g.arc(-16,-3,3,0,7);g.fill();
    g.restore();
  }
  function drawCat(now){
    if(!cat)return;
    var laneW=W/4,cx=(cat.lane+1)*laneW,sc=laneW*2/236,el=now-cat.t0,happy=(cat.state==='happy');
    var squish=1-.07*Math.max(0,1-(performance.now()-lastPet)/140);
    if(cat.form==='tail'&&cat.state==='peek'){drawTail(cx,H+8,sc,now);return;}
    if(cat.form==='tail'&&(cat.state==='leave'||happy)){
      var pt=cat.state==='leave'?Math.min(1,el/.6):0;drawTail(cx,H+8+pt*220*sc,sc,now);return;}
    if(cat.form==='head'){
      var up=H+55*sc-105*sc,hy;
      if(cat.state==='peek')hy=H+55*sc-ease(el/.45)*105*sc*(1+.05*Math.sin(el*8));
      else if(cat.state==='happy')hy=up;
      else if(cat.state==='leave')hy=up+Math.min(1,el/.6)*110*sc;
      else hy=up-Math.min(1,el/1.5)*(H+260);
      drawCatHead(cx,hy,sc*1.05,happy);
      if(cat.state==='lure')drawFish(cx,hy-100*sc-10,sc*1.1);
      return;
    }
    var by;
    if(cat.state==='block')by=H+6+(1-ease(el/.35))*280*sc;
    else if(cat.state==='happy')by=H+6;
    else if(cat.state==='leave')by=H+6+Math.min(1,el/.6)*290*sc;
    else by=H+6-Math.min(1,el/1.5)*(H+320);
    drawCatSit(cx,by,sc,happy,cat.state==='block'||happy?squish:1);
    if(cat.state==='lure')drawFish(cx,by-205*sc-12,sc*1.1);
  }
  function rr(x,y,w,h,r){g.beginPath();if(g.roundRect){g.roundRect(x,y,w,h,r);}else{g.rect(x,y,w,h);}}
  function loop(){
    if(!running)return;
    var now=gt(),tm=judgeTime(),F=DIFF[diff].fall,hitY=H*.8,laneW=W/4,i,nw=performance.now();
    for(i=0;i<notes.length;i++){
      var n=notes[i];if(n.done)continue;
      if(n.t<tm-.16){n.done=true;st.miss++;st.combo=0;pop('miss',n.lane);}
      else if(n.t>tm+F)break;
    }
    updateCat(now);
    // 背景
    g.fillStyle='#1d0b17';g.fillRect(0,0,W,H);
    if(bgok){var sc=Math.max(W/bgimg.width,H/bgimg.height),iw=bgimg.width*sc,ih=bgimg.height*sc;g.drawImage(bgimg,-(iw-W)*.38,-(ih-H)*.5,iw,ih);}
    var ov=g.createLinearGradient(0,0,0,H);ov.addColorStop(0,'rgba(40,14,32,'+(.7-pulse*.14)+')');ov.addColorStop(1,'rgba(29,11,23,'+(.9-pulse*.1)+')');
    g.fillStyle=ov;g.fillRect(0,0,W,H);
    pulse=Math.max(0,pulse-.045);
    // 花びら
    petals.forEach(function(p){
      p.y+=p.vy/60*1.6;p.x+=p.vx/60*1.6;p.r+=p.sp;if(p.y>1.05){p.y=-.05;p.x=Math.random();}
      g.save();g.translate(p.x*W,p.y*H);g.rotate(p.r);g.globalAlpha=p.a;g.fillStyle='#ffc1da';g.beginPath();g.ellipse(0,0,p.s,p.s*.55,0,0,7);g.fill();g.restore();
    });
    g.globalAlpha=1;
    // レーン
    for(i=0;i<4;i++){
      g.fillStyle='rgba(20,6,16,.38)';g.fillRect(i*laneW+1,0,laneW-2,H);
      if(flashes[i]>0){
        var lg=g.createLinearGradient(0,hitY,0,hitY-H*.7);lg.addColorStop(0,COLORS[i]);lg.addColorStop(1,'rgba(255,255,255,0)');
        g.globalAlpha=.55*flashes[i];g.fillStyle=lg;g.fillRect(i*laneW+1,hitY-H*.7,laneW-2,H*.7);g.globalAlpha=1;
        flashes[i]=Math.max(0,flashes[i]-.07);
      }
    }
    // 判定ライン
    var hl=g.createLinearGradient(0,0,W,0);hl.addColorStop(0,'rgba(255,143,184,0)');hl.addColorStop(.5,'#fff');hl.addColorStop(1,'rgba(255,143,184,0)');
    g.fillStyle='rgba(255,179,209,.28)';g.fillRect(0,hitY-8,W,16);g.fillStyle=hl;g.fillRect(0,hitY-2,W,4);
    g.fillStyle='rgba(20,6,16,.55)';g.fillRect(0,hitY+2,W,H-hitY);
    for(i=0;i<4;i++){
      var cx=i*laneW+laneW/2,cy=hitY+(H-hitY)*.45,rad=laneW*.3;
      var rg=g.createRadialGradient(cx,cy-rad*.3,rad*.1,cx,cy,rad);rg.addColorStop(0,'#fff');rg.addColorStop(.35,COLORS[i]);rg.addColorStop(1,COLORS[i]);
      g.fillStyle=rg;g.globalAlpha=.55+.45*flashes[i];g.beginPath();g.arc(cx,cy,rad*(1+.1*flashes[i]),0,7);g.fill();g.globalAlpha=1;
      g.fillStyle='#4a1a38';g.font='bold 16px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('DFJK'.charAt(i),cx,cy);
    }
    if(cat&&cat.state!=='block')drawCat(now);
    // 音符
    for(i=0;i<notes.length;i++){
      var nn=notes[i];if(nn.done)continue;
      var dt=nn.t-tm;if(dt>F)break;
      var y=hitY-dt/F*hitY,rw=laneW*.8,rh=laneW*.4,x=nn.lane*laneW+(laneW-rw)/2,c=COLORS[nn.lane];
      g.globalAlpha=.35;g.fillStyle=c;rr(x-4,y-rh/2-4,rw+8,rh+8,rh/2+4);g.fill();g.globalAlpha=1;
      var ng=g.createLinearGradient(0,y-rh/2,0,y+rh/2);ng.addColorStop(0,'#fff');ng.addColorStop(.3,c);ng.addColorStop(1,c);
      g.fillStyle=ng;rr(x,y-rh/2,rw,rh,rh/2);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
      g.fillStyle='rgba(74,26,56,.75)';g.font='bold '+Math.round(rh*.7)+'px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('♪',x+rw/2,y+1);
    }
    if(cat&&cat.state==='block')drawCat(now);
    // 光のリングとかけら
    rings=rings.filter(function(r){return nw-r.t<420;});
    rings.forEach(function(r){var a=(nw-r.t)/420;g.globalAlpha=1-a;g.strokeStyle=r.big?'#fff':r.c;g.lineWidth=r.big?4:3;g.beginPath();g.arc(r.x,r.y,laneW*(.2+a*(r.big?.8:.55)),0,7);g.stroke();});
    g.globalAlpha=1;
    parts=parts.filter(function(p){return p.l>0;});
    parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.14;p.l-=.028;g.globalAlpha=Math.max(0,p.l);g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();});
    g.globalAlpha=1;
    hearts=hearts.filter(function(h){return nw-h.t<900;});
    hearts.forEach(function(h){var a=(nw-h.t)/900;g.globalAlpha=1-a;g.fillStyle='#ff6f9c';g.textAlign='center';g.textBaseline='middle';g.font='bold 26px sans-serif';g.fillText('♥',h.x,h.y-a*70);});
    g.globalAlpha=1;
    if(msgO){var ma=nw-msgO.t;if(ma<2600){g.globalAlpha=ma>2100?1-(ma-2100)/500:1;g.textAlign='center';g.textBaseline='middle';g.font='bold 15px sans-serif';
      var mt=t(msgO.k),mw=Math.min(W-24,g.measureText(mt).width+28);g.fillStyle='rgba(58,21,48,.82)';rr(W/2-mw/2,H*.17-16,mw,32,16);g.fill();
      g.fillStyle='#fff';g.fillText(mt,W/2,H*.17+1);g.globalAlpha=1;}else msgO=null;}
    // 判定文字
    pops=pops.filter(function(p){return nw-p.t<450;});
    pops.forEach(function(p){
      var a=1-(nw-p.t)/450;g.globalAlpha=a;g.textAlign='center';g.textBaseline='middle';g.font='bold 22px sans-serif';
      var tx=p.l*laneW+laneW/2,ty=hitY-48-(1-a)*22;
      g.lineWidth=4;g.strokeStyle='rgba(60,10,40,.8)';g.strokeText(t(p.k),tx,ty);
      g.fillStyle=p.k==='perfect'?'#fff27a':p.k==='good'?'#8fe0ff':'#ff7b8b';g.fillText(t(p.k),tx,ty);g.globalAlpha=1;
    });
    // スコア・コンボ
    var sctxt=Math.round(st.earned/(notes.length||1)*1000000).toLocaleString();
    g.textAlign='right';g.textBaseline='top';g.font='bold 24px sans-serif';g.lineWidth=4;g.strokeStyle='rgba(60,10,40,.8)';g.strokeText(sctxt,W-12,10);g.fillStyle='#fff';g.fillText(sctxt,W-12,10);
    g.font='12px sans-serif';g.fillStyle='#ffb3d1';g.fillText(t('score'),W-12,38);
    if(st.combo>1){
      var pp=Math.max(0,1-(nw-comboT)/160),k=1+.35*pp;
      g.save();g.translate(W/2,H*.3);g.scale(k,k);g.textAlign='center';g.textBaseline='middle';
      g.font='bold 52px sans-serif';g.lineWidth=6;g.strokeStyle='rgba(224,112,159,.9)';g.strokeText(String(st.combo),0,0);g.fillStyle='#fff';g.fillText(String(st.combo),0,0);
      g.font='bold 14px sans-serif';g.fillStyle='#ffd6e6';g.fillText(t('combo'),0,40);g.restore();
    }
    if(now>-2.2&&now<0){g.textAlign='center';g.textBaseline='middle';g.font='bold 64px sans-serif';g.lineWidth=7;g.strokeStyle='rgba(224,112,159,.9)';var cd=String(Math.ceil(-now));g.strokeText(cd,W/2,H*.45);g.fillStyle='#fff';g.fillText(cd,W/2,H*.45);}
    var pg=g.createLinearGradient(0,0,W,0);pg.addColorStop(0,'#ff8fb8');pg.addColorStop(1,'#c9a0ff');
    g.fillStyle='rgba(255,255,255,.12)';g.fillRect(0,0,W,5);g.fillStyle=pg;g.fillRect(0,0,W*Math.max(0,Math.min(1,now/dur)),5);
    if(now>dur+.8){finish();return;}
    raf=requestAnimationFrame(loop);
  }

  cv.addEventListener('pointerdown',function(e){
    e.preventDefault();var r=cv.getBoundingClientRect();
    tap(Math.max(0,Math.min(3,Math.floor((e.clientX-r.left)/r.width*4))));
  });
  window.addEventListener('keydown',function(e){
    if(e.repeat)return;var k=KEYS[(e.key||'').toLowerCase()];if(k!==undefined)tap(k);
  });
  document.addEventListener('visibilitychange',function(){if(document.hidden&&running){stop();show('menu');}});
  $('start').onclick=begin;
  $('again').onclick=begin;
  $('tomenu').onclick=function(){show('menu');};
  $('quit').onclick=function(){stop();show('menu');};
  $('fish').onclick=useFish;
  window.__mina_dbg={buildChart:buildChart};
})();
