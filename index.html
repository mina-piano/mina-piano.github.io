<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mina piano オフィシャルホームページ</title>
<meta name="description" content="17LIVEライバー mina piano のホームページ。イベント情報、写真、オリジナルソング、リンク集。 / Official website of mina piano, 17LIVE streamer and pianist: events, photos, original songs and links.">
<meta property="og:title" content="mina piano">
<meta property="og:description" content="イベント情報・写真・オリジナルソング・リンク集 / Events, photos, original songs and links">
<meta property="og:type" content="website">
<meta property="og:image" content="https://mina-piano.github.io/header.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#fff7fa;--card:#ffffff;--ink:#3a2a33;--sub:#8a6f7b;--accent:#e0709f;--accent2:#b84d7b;--line:#f3d9e4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7;font-size:17px}
a{color:var(--accent2)}
header.hero{position:relative;color:#fff;text-align:center;background:url(header.jpg) 38% center/cover no-repeat,linear-gradient(160deg,#f7b6d0,#e0709f 60%,#b84d7b);aspect-ratio:4/3;max-height:78vh;min-height:260px;display:flex;align-items:flex-end;justify-content:center}
header.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(58,26,45,0) 45%,rgba(58,26,45,.78) 100%)}
header.hero .in{position:relative;padding:0 16px 22px}
header.hero h1{margin:0;font-size:2.4rem;letter-spacing:.04em;text-shadow:0 2px 10px rgba(0,0,0,.55)}
header.hero p{margin:6px 0 0;font-size:1.05rem;text-shadow:0 1px 8px rgba(0,0,0,.6)}
@media(min-width:760px){header.hero{aspect-ratio:16/7;background-position:center 30%}header.hero h1{font-size:3rem}}
.note{font-size:.9rem;opacity:.9}
nav{position:sticky;top:0;z-index:5;background:rgba(255,247,250,.95);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px;padding:10px}
nav a{text-decoration:none;color:#fff;background:var(--accent);font-weight:700;padding:7px 16px;font-size:.9rem;border-radius:999px}
nav a:hover{background:var(--accent2)}
main{max-width:860px;margin:0 auto;padding:8px 16px 40px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin:20px 0;box-shadow:0 2px 8px rgba(224,112,159,.08)}
section h2{margin:0 0 12px;font-size:1.3rem;color:var(--accent2);border-left:6px solid var(--accent);padding-left:10px}
.empty{color:var(--sub)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:999px}
.btn:hover{background:var(--accent2)}
.btn.shop{background:#fff;color:var(--accent2);border:2px solid var(--accent)}
.subh{margin:14px 0 8px;font-size:1rem;color:var(--sub);font-weight:700}
.ev{border-top:1px dashed var(--line);padding:12px 0}
.ev:first-of-type{border-top:none}
.ev .d{font-weight:700;color:var(--accent2)}
.ev .t{font-size:1.1rem;font-weight:700}
.ev .m{color:var(--sub);font-size:.95rem}
.ev.past{opacity:.6}
.ev img.fl{display:block;width:100%;max-width:380px;border-radius:12px;margin:10px 0 4px;cursor:pointer}
details summary{cursor:pointer;color:var(--sub);margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid figure{margin:0}
.grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;cursor:pointer;display:block;background:#f3e3ea}
.grid figcaption{font-size:.85rem;color:var(--sub);margin-top:4px}
.song{border-top:1px dashed var(--line);padding:12px 0}
.song:first-of-type{border-top:none}
.song summary{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:1rem;padding:9px 18px;border-radius:999px;cursor:pointer;list-style:none}
.song summary:hover{background:var(--accent2)}
.song summary::-webkit-details-marker{display:none}
.song summary::after{content:' ▸';font-size:.85em}
.song[open] summary{background:var(--accent2)}
.song[open] summary::after{content:' ▾'}
.song .body{margin-top:12px}
.song .m{color:var(--sub);font-size:.95rem;margin-bottom:6px}
audio{width:100%}
a.dl{display:inline-block;margin-top:6px;padding:6px 14px;border:2px solid var(--accent);border-radius:999px;text-decoration:none;font-weight:700;font-size:.9rem}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
footer{text-align:center;color:var(--sub);font-size:.85rem;padding:20px 16px 40px}
#lang{position:fixed;top:10px;right:10px;z-index:30;display:flex;gap:0;border-radius:999px;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#lang button{border:0;background:rgba(58,26,45,.55);color:#fff;font-weight:700;font-size:.85rem;padding:7px 12px;cursor:pointer}
#lang button.on{background:#fff;color:var(--accent2)}
</style>
</head>
<body>
<div id="lang"><button type="button" data-l="ja">日本語</button><button type="button" data-l="en">English</button></div>
<header class="hero" role="img" aria-label="mina piano">
  <div class="in">
    <h1>mina piano</h1>
    <p data-t="sub"></p>
  </div>
</header>
<nav>
  <a href="#links" data-t="nLinks"></a>
  <a href="#events" data-t="nEvents"></a>
  <a href="#songs" data-t="nSongs"></a>
  <a href="#game" data-t="nGame"></a>
  <a href="#photos" data-t="nPhotos"></a>
  <a href="#shop" data-t="nShop"></a>
</nav>
<main>
  <section id="links"><h2 data-t="nLinks"></h2><div id="links-body" class="btns"></div></section>
  <section id="events"><h2 data-t="hEvents"></h2><div id="events-body"></div></section>
  <section id="songs"><h2 data-t="nSongs"></h2><div id="songs-body"></div></section>
  <section id="game"><h2 data-t="nGame"></h2><p data-t="gameDesc" style="margin:0 0 12px"></p><a class="btn" href="game.html" id="gamelink" data-t="gamePlay"></a></section>
  <section id="photos"><h2 data-t="nPhotos"></h2><div id="photos-body"></div></section>
  <section id="shop"><h2 data-t="nShop"></h2><div id="shop-body" class="btns"></div></section>
</main>
<div id="lb"><img alt=""></div>
<footer>© mina piano<br><span data-t="foot"></span></footer>
<script>
(function(){
  var T={
    ja:{title:'mina piano オフィシャルホームページ',sub:'17LIVEライバー ／ ピアノ',nLinks:'リンク',nEvents:'イベント',hEvents:'イベント情報',nSongs:'オリジナルソング',nPhotos:'写真',nGame:'リズムゲーム',gameDesc:'オリジナルソングに合わせて、流れてくる音符をタップ! 曲は自動で譜面になります。',gamePlay:'あそんでみる',nShop:'グッズ・楽曲販売',
        foot:'このホームページには、個人の情報は掲載していません。',soon:'準備中です',noEv:'いまのところ、予定されているイベントはありません。',past:'過去のイベント(%n件)',more:'くわしくはこちら',dl:'この曲をダウンロード',dlPrep:'準備しています…',dlTap:'もういちどタップして保存',dlLine:'LINEの中では保存できません。右下の「…」→「Safariで開く」で開いてください。',dlFail:'保存できませんでした。曲を再生してから、共有ボタンの「ファイルに保存」をお試しください。',buy:'配信・購入はこちら',photo:'写真'},
    en:{title:'mina piano Official Website',sub:'17LIVE Streamer / Pianist',nLinks:'Links',nEvents:'Events',hEvents:'Events',nSongs:'Original Songs',nPhotos:'Photos',nGame:'Rhythm Game',gameDesc:'Tap the notes in time with the original songs! Every song becomes a chart automatically.',gamePlay:'Play now',nShop:'Goods & Music Store',
        foot:'This website does not publish any personal information.',soon:'Coming soon',noEv:'No events are scheduled right now.',past:'Past events (%n)',more:'More info',dl:'Download this song',dlPrep:'Preparing…',dlTap:'Tap again to save',dlLine:'Saving does not work inside LINE. Tap the "…" at the bottom right and choose "Open in Safari".',dlFail:'Could not save. Play the song, then try "Save to Files" from the share button.',buy:'Listen / buy this song',photo:'Photo'}
  };
  var lang='ja';
  try{
    var q=/[?&]lang=(en|ja)/.exec(location.search),saved=null;
    try{saved=localStorage.getItem('mina-lang');}catch(e){}
    if(q) lang=q[1];
    else if(saved==='en'||saved==='ja') lang=saved;
    else if(navigator.language&&navigator.language.toLowerCase().indexOf('ja')!==0) lang='en';
  }catch(e){}
  function t(k){return T[lang][k];}
  function pick(ja,en){return (lang==='en'&&en)?en:ja;}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function okUrl(u){return /^https?:\/\//i.test(u);}
  function okPath(p){return /^[A-Za-z0-9_\-\/\.]+$/.test(p)&&p.indexOf('..')<0;}
  function load(name){return fetch(name+'?t='+Date.now()).then(function(r){return r.ok?r.text():'';}).catch(function(){return '';});}
  function rows(t){return t.split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return s&&s.charAt(0)!=='#';}).map(function(s){return s.split('|').map(function(x){return x.trim();});});}
  var D={links:'',events:'',songs:'',photos:''};
  var lb=document.getElementById('lb'),lbi=lb.querySelector('img');
  lb.addEventListener('click',function(){lb.style.display='none';});
  function zoom(box,sel){box.querySelectorAll(sel).forEach(function(im){im.addEventListener('click',function(){lbi.src=im.getAttribute('data-src');lb.style.display='flex';});});}
  function renderLinks(){
    var sec='SNS',sns=[],shop=[];
    D.links.split(/\r?\n/).forEach(function(s){
      s=s.trim();if(!s)return;
      var m=/^#\s*(SNS|ショップ)/.exec(s);
      if(m){sec=m[1];return;}
      if(s.charAt(0)==='#')return;
      var p=s.split('|').map(function(x){return x.trim();});
      if(p.length<2||!p[0]||!okUrl(p[1]))return;
      (sec==='SNS'?sns:shop).push({n:pick(p[0],p[2]),u:p[1]});
    });
    function btn(x,c){return '<a class="btn '+c+'" href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.n)+'</a>';}
    document.getElementById('links-body').innerHTML=sns.length?sns.map(function(x){return btn(x,'');}).join(''):'<span class="empty">'+t('soon')+'</span>';
    document.getElementById('shop-body').innerHTML=shop.length?shop.map(function(x){return btn(x,'shop');}).join(''):'<span class="empty">'+t('soon')+'</span>';
  }
  function renderEvents(){
    var box=document.getElementById('events-body');
    var ev=rows(D.events).filter(function(r){return r[0]&&r[2];});
    if(!ev.length){box.innerHTML='<p class="empty">'+t('soon')+'</p>';return;}
    ev.sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0;});
    var n=new Date(),key=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2);
    function one(r,past){
      var title=pick(r[2],r[6]),memo=pick(r[3],r[7]);
      var h='<div class="ev'+(past?' past':'')+'"><div class="d">'+esc(r[0])+(r[1]?'　'+esc(r[1]):'')+'</div><div class="t">'+esc(title)+'</div>';
      if(memo)h+='<div class="m">'+esc(memo)+'</div>';
      if(r[5]&&okPath(r[5]))h+='<img class="fl" loading="lazy" src="'+esc(r[5])+'" alt="'+esc(title)+'" data-src="'+esc(r[5])+'">';
      if(r[4]&&okUrl(r[4]))h+='<div class="m"><a href="'+esc(r[4])+'" target="_blank" rel="noopener">'+t('more')+'</a></div>';
      return h+'</div>';
    }
    var up=ev.filter(function(r){return r[0]>=key;}),pa=ev.filter(function(r){return r[0]<key;}).reverse();
    var html=up.length?up.map(function(r){return one(r,false);}).join(''):'<p class="empty">'+t('noEv')+'</p>';
    if(pa.length)html+='<details><summary>'+t('past').replace('%n',pa.length)+'</summary>'+pa.map(function(r){return one(r,true);}).join('')+'</details>';
    box.innerHTML=html;zoom(box,'img.fl');
  }
  function renderSongs(){
    var box=document.getElementById('songs-body');
    var s=rows(D.songs).filter(function(r){return r[0]&&r[1]&&okPath(r[1]);});
    if(!s.length){box.innerHTML='<p class="empty">'+t('soon')+'</p>';return;}
    box.innerHTML=s.map(function(r){
      var title=pick(r[0],r[4]),desc=pick(r[2],r[5]);
      var h='<details class="song"><summary>'+esc(title)+'</summary><div class="body">';
      if(desc)h+='<div class="m">'+esc(desc)+'</div>';
      h+='<audio controls preload="none" src="'+esc(r[1])+'"></audio>';
      h+='<div class="m"><a class="dl" href="'+esc(r[1])+'" download="'+esc(title.replace(/[\\\/:*?"<>|]/g,' '))+'.mp3">'+t('dl')+'</a></div>';
      if(r[3]&&okUrl(r[3]))h+='<div class="m"><a href="'+esc(r[3])+'" target="_blank" rel="noopener">'+t('buy')+'</a></div>';
      return h+'</div></details>';
    }).join('');
    attachDl(box);
  }
  var IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  function attachDl(box){
    if(!IOS)return;
    box.querySelectorAll('a.dl').forEach(function(a){
      var ready=null,busy=false,label=a.textContent,file=a.getAttribute('href'),name=(a.getAttribute('download')||'song.mp3');
      a.addEventListener('click',function(e){
        e.preventDefault();
        if(/Line\//i.test(navigator.userAgent)){a.textContent=t('dlLine');return;}
        if(ready){
          var f=ready;
          navigator.share({files:[f],title:name}).then(function(){ready=null;a.textContent=label;}).catch(function(err){
            ready=null;a.textContent=label;
            if(!err||err.name!=='AbortError'){a.textContent=t('dlFail');window.open(file,'_blank');}
          });
          return;
        }
        if(busy)return;busy=true;a.textContent=t('dlPrep');
        fetch(file).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(b){
          var f=new File([b],name,{type:'audio/mpeg'});
          busy=false;
          if(navigator.canShare&&navigator.canShare({files:[f]})){ready=f;a.textContent=t('dlTap');}
          else{a.textContent=label;window.open(file,'_blank');}
        }).catch(function(){busy=false;a.textContent=t('dlFail');window.open(file,'_blank');});
      });
    });
  }
  function renderPhotos(){
    var box=document.getElementById('photos-body');
    var p=rows(D.photos).filter(function(r){return r[0]&&okPath(r[0]);});
    if(!p.length){box.innerHTML='<p class="empty">'+t('soon')+'</p>';return;}
    box.innerHTML='<div class="grid">'+p.map(function(r){
      var c=pick(r[1],r[2]);
      return '<figure><img loading="lazy" src="'+esc(r[0])+'" alt="'+esc(c||t('photo'))+'" data-src="'+esc(r[0])+'">'+(c?'<figcaption>'+esc(c)+'</figcaption>':'')+'</figure>';
    }).join('')+'</div>';
    zoom(box,'img');
  }
  function render(){
    document.documentElement.lang=lang;
    document.title=t('title');
    document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.getAttribute('data-t'));});
    document.querySelectorAll('#lang button').forEach(function(b){b.className=(b.getAttribute('data-l')===lang)?'on':'';});
    renderLinks();renderEvents();renderSongs();renderPhotos();
  }
  document.querySelectorAll('#lang button').forEach(function(b){
    b.addEventListener('click',function(){lang=b.getAttribute('data-l');try{localStorage.setItem('mina-lang',lang);}catch(e){}render();});
  });
  render();
  Promise.all([load('links.txt'),load('events.txt'),load('songs.txt'),load('photos.txt')]).then(function(a){
    D.links=a[0];D.events=a[1];D.songs=a[2];D.photos=a[3];render();
  });
})();
</script>
</body>
</html>
