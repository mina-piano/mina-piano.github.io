<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mina piano オフィシャルホームページ</title>
<meta name="description" content="17LIVEライバー mina piano のホームページ。イベント情報、写真、オリジナルソング、リンク集。 / Official website of mina piano, 17LIVE streamer and pianist: events, photos, original songs and links.">
<meta property="og:title" content="mina piano">
<meta property="og:description" content="イベント情報・写真・オリジナルソング・リンク集 / Events, photos, original songs and links">
<meta property="og:type" content="website">
<meta property="og:image" content="https://mina-piano.github.io/header.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--bg:#fff7fa;--card:#ffffff;--ink:#3a2a33;--sub:#8a6f7b;--accent:#e0709f;--accent2:#b84d7b;--line:#f3d9e4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7;font-size:17px}
a{color:var(--accent2)}
header.hero{position:relative;color:#fff;text-align:center;background:url(header.jpg?v=2) 38% center/cover no-repeat,linear-gradient(160deg,#f7b6d0,#e0709f 60%,#b84d7b);aspect-ratio:4/3;max-height:78vh;min-height:260px;display:flex;align-items:flex-end;justify-content:center}
header.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(58,26,45,0) 45%,rgba(58,26,45,.78) 100%)}
header.hero .in{position:relative;padding:0 16px 22px}
header.hero h1{margin:0;font-size:2.4rem;letter-spacing:.04em;text-shadow:0 2px 10px rgba(0,0,0,.55)}
header.hero p{margin:6px 0 0;font-size:1.05rem;text-shadow:0 1px 8px rgba(0,0,0,.6)}
@media(min-width:760px){header.hero{aspect-ratio:16/7;background-position:center 30%}header.hero h1{font-size:3rem}}
.note{font-size:.9rem;opacity:.9}
nav{position:sticky;top:0;z-index:5;background:rgba(255,247,250,.95);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:center;gap:8px 10px;padding:10px}
nav a{text-decoration:none;color:#fff;background:var(--accent);font-weight:700;padding:7px 16px;font-size:.9rem;border-radius:999px}
nav a:hover{background:var(--accent2)}
nav a.active{outline:3px solid var(--accent2);box-shadow:0 2px 0 var(--accent2)}
.tapnote{text-align:center;color:var(--accent2);font-weight:700;font-size:.9rem;margin:10px 0 0}
.app-btn{display:block;width:max-content;max-width:92%;margin:12px auto 0;background:#fff;color:var(--accent2);border:2px solid var(--accent);border-radius:999px;padding:9px 20px;font-size:.95rem;font-weight:700;text-decoration:none;text-align:center}
.app-btn:hover{background:var(--bg)}
.tab-off{display:none!important}
#intro .text{white-space:pre-wrap;margin:0}
section#app ol{margin:6px 0 14px;padding-left:1.4em}
section#app li{margin:4px 0}
.rep-search{display:block;width:100%;padding:11px 16px;border:2px solid var(--line);border-radius:999px;margin-bottom:16px;font-size:1rem;color:var(--ink);background:var(--bg)}
.rep-search:focus{outline:none;border-color:var(--accent)}
.rep-group{margin:16px 0}
.rep-group:first-child{margin-top:0}
.rep-group h3{margin:0 0 6px;font-size:.95rem;color:var(--accent2);border-bottom:1px dashed var(--line);padding-bottom:4px}
.rep-group ul{margin:0;padding-left:1.2em;column-width:200px}
.rep-group li{margin:4px 0;break-inside:avoid}
.rep-group li a{text-decoration:none}
.rep-group li a:hover{text-decoration:underline}
.rep-group li a::after{content:' ♪';opacity:.6;font-size:.85em}
#cal{margin:0 0 18px;border:1px solid var(--line);border-radius:14px;padding:10px 8px 12px;background:var(--bg)}
#cal .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
#cal .ch b{color:var(--accent2);font-size:1.05rem}
#cal .ch button{border:0;background:var(--accent);color:#fff;border-radius:999px;width:36px;height:32px;font-size:1rem;font-weight:700;cursor:pointer}
#cal .g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
#cal .w{font-size:.75rem;color:var(--sub);padding:2px 0}
#cal .w.su,#cal .cd.su{color:#d2476f}
#cal .w.sa,#cal .cd.sa{color:#3f78c4}
#cal .cd{font:inherit;font-size:.95rem;border:0;background:transparent;border-radius:10px;min-height:42px;padding:3px 0;color:var(--ink);position:relative}
#cal .cd.em{visibility:hidden}
#cal .cd.today{outline:2px solid var(--line)}
#cal .cd.has{background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
#cal .cd.has.past{background:#d9c3cd}
#cal .cd.has small{display:block;font-size:.62rem;line-height:1;margin-top:2px;font-weight:700}
.ev.flash{background:#ffe3ee;border-radius:10px;transition:background .3s}
main{max-width:860px;margin:0 auto;padding:8px 16px 40px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin:20px 0;box-shadow:0 2px 8px rgba(224,112,159,.08)}
section h2{margin:0 0 12px;font-size:1.3rem;color:var(--accent2);border-left:6px solid var(--accent);padding-left:10px}
.empty{color:var(--sub)}
.btns{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:12px 20px;border-radius:999px}
.btn:hover{background:var(--accent2)}
.btn.shop{background:#fff;color:var(--accent2);border:2px solid var(--accent)}
.subh{margin:14px 0 8px;font-size:1rem;color:var(--sub);font-weight:700}
.ev{border-top:1px dashed var(--line);padding:12px 0}
.ev:first-of-type{border-top:none}
.ev .d{font-weight:700;color:var(--accent2)}
.ev .t{font-size:1.1rem;font-weight:700}
.ev .m{color:var(--sub);font-size:.95rem}
.ev.past{opacity:.6}
.ev img.fl{display:block;width:100%;max-width:380px;border-radius:12px;margin:10px 0 4px;cursor:pointer}
details summary{cursor:pointer;color:var(--sub);margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid figure{margin:0}
.grid img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:12px;cursor:pointer;display:block;background:#f3e3ea}
.grid figcaption{font-size:.85rem;color:var(--sub);margin-top:4px}
.song{border-top:1px dashed var(--line);padding:12px 0}
.song:first-of-type{border-top:none}
.song summary{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:1rem;padding:9px 18px;border-radius:999px;cursor:pointer;list-style:none}
.song summary:hover{background:var(--accent2)}
.song summary::-webkit-details-marker{display:none}
.song summary::after{content:' ▸';font-size:.85em}
.song[open] summary{background:var(--accent2)}
.song[open] summary::after{content:' ▾'}
.song .body{margin-top:12px}
.song .m{color:var(--sub);font-size:.95rem;margin-bottom:6px}
audio{width:100%}
a.dl{display:inline-block;margin-top:6px;padding:6px 14px;border:2px solid var(--accent);border-radius:999px;text-decoration:none;font-weight:700;font-size:.9rem}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
footer{text-align:center;color:var(--sub);font-size:.85rem;padding:20px 16px 40px}
#lang{position:fixed;top:10px;right:10px;z-index:30;display:flex;gap:0;border-radius:999px;overflow:hidden;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#lang button{border:0;background:rgba(58,26,45,.55);color:#fff;font-weight:700;font-size:.85rem;padding:7px 12px;cursor:pointer}
#lang button.on{background:#fff;color:var(--accent2)}
</style>
</head>
<body>
<div id="lang"><button type="button" data-l="ja">日本語</button><button type="button" data-l="en">English</button></div>
<header class="hero" role="img" aria-label="mina piano">
  <div class="in">
    <h1>mina piano</h1>
    <p data-t="sub"></p>
  </div>
</header>
<p class="tapnote" data-t="tapHint"></p>
<a class="app-btn" href="#app" data-t="appBtn"></a>
<nav>
  <a href="#intro" data-t="nIntro"></a>
  <a href="#events" data-t="nEvents"></a>
  <a href="#repertoire" data-t="nRepertoire"></a>
  <a href="#links" data-t="nLinks"></a>
  <a href="#songs" data-t="nSongs"></a>
  <a href="#game" data-t="nGame"></a>
  <a href="#photos" data-t="nPhotos"></a>
  <a href="#shop" data-t="nShop"></a>
</nav>
<main>
  <section id="intro"><h2 data-t="nIntro"></h2><div id="intro-body"></div></section>
  <section id="events"><h2 data-t="hEvents"></h2><div id="events-body"></div></section>
  <section id="repertoire"><h2 data-t="nRepertoire"></h2><div id="repertoire-body"></div></section>
  <section id="links"><h2 data-t="nLinks"></h2><div id="links-body" class="btns"></div></section>
  <section id="songs"><h2 data-t="nSongs"></h2><div id="songs-body"></div></section>
  <section id="game"><h2 data-t="nGame"></h2><p data-t="gameDesc" style="margin:0 0 12px"></p><a class="btn" href="game.html" id="gamelink" data-t="gamePlay"></a></section>
  <section id="photos"><h2 data-t="nPhotos"></h2><div id="photos-body"></div></section>
  <section id="shop"><h2 data-t="nShop"></h2><div id="shop-body" class="btns"></div></section>
  <section id="app">
    <h2 data-t="nApp"></h2>
    <p data-t="appLead"></p>
    <div class="subh" data-t="appIos"></div>
    <ol>
      <li data-t="appIos1"></li>
      <li data-t="appIos2"></li>
      <li data-t="appIos3"></li>
      <li data-t="appIos4"></li>
    </ol>
    <div class="subh" data-t="appAnd"></div>
    <ol>
      <li data-t="appAnd1"></li>
      <li data-t="appAnd2"></li>
      <li data-t="appAnd3"></li>
    </ol>
  </section>
</main>
<div id="lb"><img alt=""></div>
<footer>© mina piano<br><span data-t="foot"></span></footer>
<script>
(function(){
  var T={
    ja:{title:'mina piano オフィシャルホームページ',sub:'17LIVEライバー ／ ピアノ',nIntro:'mina pianoについて',nRepertoire:'曲リスト',repSearch:'🔍 曲名やアーティスト名で検索',repOther:'その他',repNone:'見つかりませんでした',nLinks:'リンク',nEvents:'イベント',hEvents:'イベント情報',nSongs:'オリジナルソング',nPhotos:'写真',nGame:'リズムゲーム',gameDesc:'オリジナルソングに合わせて、流れてくる音符をタップ! 曲は自動で譜面になります。',gamePlay:'あそんでみる',nShop:'グッズ・楽曲販売',tapHint:'ボタンをタップしてね👇',
        appBtn:'📱 スマホにアイコンを置く方法',nApp:'スマホにアイコンを置く',appLead:'ホーム画面にアイコンを置くと、アプリのように、1回タップするだけで開けます。',appIos:'iPhone(Safari)の場合',appIos1:'Safariでこのページを開きます。',appIos2:'下にある共有ボタン(四角から上向きの矢印)をタップします。',appIos3:'出てきた一覧を上にずらして「ホーム画面に追加」をタップします。',appIos4:'右上の「追加」をタップします。',appAnd:'Androidの場合(Chrome)',appAnd1:'Chromeでこのページを開きます。',appAnd2:'右上の「︙」(点が3つ)をタップします。',appAnd3:'「ホーム画面に追加」→「追加」をタップします。',
        foot:'このホームページには、個人の情報は掲載していません。',soon:'準備中です',noEv:'いまのところ、予定されているイベントはありません。',past:'過去のイベント(%n件)',more:'くわしくはこちら',dl:'この曲をダウンロード',dlPrep:'準備しています…',dlTap:'もういちどタップして保存',dlLine:'LINEの中では保存できません。右下の「…」→「Safariで開く」で開いてください。',dlFail:'保存できませんでした。曲を再生してから、共有ボタンの「ファイルに保存」をお試しください。',buy:'配信・購入はこちら',photo:'写真'},
    en:{title:'mina piano Official Website',sub:'17LIVE Streamer / Pianist',nIntro:'About mina piano',nRepertoire:'Song List',repSearch:'🔍 Search by song or artist',repOther:'Other',repNone:'No matches found',nLinks:'Links',nEvents:'Events',hEvents:'Events',nSongs:'Original Songs',nPhotos:'Photos',nGame:'Rhythm Game',gameDesc:'Tap the notes in time with the original songs! Every song becomes a chart automatically.',gamePlay:'Play now',nShop:'Goods & Music Store',tapHint:'Tap a button below 👇',
        appBtn:'📱 Add an icon to your phone',nApp:'Add to your home screen',appLead:'Put an icon on your home screen and open this site with one tap, like an app.',appIos:'iPhone (Safari)',appIos1:'Open this page in Safari.',appIos2:'Tap the share button (square with an arrow pointing up) at the bottom.',appIos3:'Scroll the menu up and tap "Add to Home Screen".',appIos4:'Tap "Add" in the top right.',appAnd:'Android (Chrome)',appAnd1:'Open this page in Chrome.',appAnd2:'Tap the "⋮" menu in the top right.',appAnd3:'Tap "Add to Home screen", then "Add".',
        foot:'This website does not publish any personal information.',soon:'Coming soon',noEv:'No events are scheduled right now.',past:'Past events (%n)',more:'More info',dl:'Download this song',dlPrep:'Preparing…',dlTap:'Tap again to save',dlLine:'Saving does not work inside LINE. Tap the "…" at the bottom right and choose "Open in Safari".',dlFail:'Could not save. Play the song, then try "Save to Files" from the share button.',buy:'Listen / buy this song',photo:'Photo'}
  };
  var lang='ja';
  try{
    var q=/[?&]lang=(en|ja)/.exec(location.search),saved=null;
    try{saved=localStorage.getItem('mina-lang');}catch(e){}
    if(q) lang=q[1];
    else if(saved==='en'||saved==='ja') lang=saved;
    else if(navigator.language&&navigator.language.toLowerCase().indexOf('ja')!==0) lang='en';
  }catch(e){}
  function t(k){return T[lang][k];}
  function pick(ja,en){return (lang==='en'&&en)?en:ja;}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function okUrl(u){return /^https?:\/\//i.test(u);}
  function okPath(p){return /^[A-Za-z0-9_\-\/\.]+$/.test(p)&&p.indexOf('..')<0;}
  function load(name){return fetch(name+'?t='+Date.now()).then(function(r){return r.ok?r.text():'';}).catch(function(){return '';});}
  function rows(t){return t.split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return s&&s.charAt(0)!=='#';}).map(function(s){return s.split('|').map(function(x){return x.trim();});});}
  var D={links:'',events:'',songs:'',photos:'',intro:'',introEn:'',repertoire:''};
  var lb=document.getElementById('lb'),lbi=lb.querySelector('img');
  lb.addEventListener('click',function(){lb.style.display='none';});
  function zoom(box,sel){box.querySelectorAll(sel).forEach(function(im){im.addEventListener('click',function(){lbi.src=im.getAttribute('data-src');lb.style.display='flex';});});}
  function renderLinks(){
    var sec='SNS',sns=[],shop=[];
    D.links.split(/\r?\n/).forEach(function(s){
      s=s.trim();if(!s)return;
      var m=/^#\s*(SNS|ショップ)/.exec(s);
      if(m){sec=m[1];return;}
      if(s.charAt(0)==='#')return;
      var p=s.split('|').map(function(x){return x.trim();});
      if(p.length<2||!p[0]||!okUrl(p[1]))return;
      (sec==='SNS'?sns:shop).push({n:pick(p[0],p[2]),u:p[1]});
    });
    function btn(x,c){return '<a class="btn '+c+'" href="'+esc(x.u)+'" target="_blank" rel="noopener">'+esc(x.n)+'</a>';}
    document.getElementById('links-body').innerHTML=sns.length?sns.map(function(x){return btn(x,'');}).join(''):'<span class="empty">'+t('soon')+'</span>';
    document.getElementById('shop-body').innerHTML=shop.length?shop.map(function(x){return btn(x,'shop');}).join(''):'<span class="empty">'+t('soon')+'</span>';
  }
  function renderEvents(){
    var box=document.getElementById('events-body');
    var ev=rows(D.events).filter(function(r){return r[0]&&r[2];});
    if(!ev.length){box.innerHTML='<p class="empty">'+t('soon')+'</p>';return;}
    ev.sort(function(a,b){return a[0]<b[0]?-1:a[0]>b[0]?1:0;});
    var n=new Date(),key=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2);
    var cal={y:null,m:null};
    var cnt={};ev.forEach(function(r){cnt[r[0]]=(cnt[r[0]]||0)+1;});
    var WJ=['日','月','火','水','木','金','土'],WE=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],ME=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    function pad(x){return ('0'+x).slice(-2);}
    function drawCal(){
      var c=document.getElementById('cal');if(!c)return;
      var first=new Date(cal.y,cal.m,1).getDay(),days=new Date(cal.y,cal.m+1,0).getDate(),W=lang==='en'?WE:WJ;
      var h='<div class="ch"><button type="button" data-n="-1" aria-label="prev">◀</button><b>'+(lang==='en'?ME[cal.m]+' '+cal.y:cal.y+'年'+(cal.m+1)+'月')+'</b><button type="button" data-n="1" aria-label="next">▶</button></div><div class="g">';
      W.forEach(function(w,i){h+='<div class="w'+(i===0?' su':i===6?' sa':'')+'">'+w+'</div>';});
      for(var i=0;i<first;i++)h+='<div class="cd em"></div>';
      for(var d=1;d<=days;d++){
        var k=cal.y+'-'+pad(cal.m+1)+'-'+pad(d),wd=(first+d-1)%7,cl='cd'+(wd===0?' su':wd===6?' sa':'')+(k===key?' today':'');
        if(cnt[k]){h+='<button type="button" class="'+cl+' has'+(k<key?' past':'')+'" data-d="'+k+'">'+d+'<small>●</small></button>';}
        else h+='<div class="'+cl+'">'+d+'</div>';
      }
      c.innerHTML=h+'</div>';
    }
    function goDay(k){
      var el=document.querySelector('[data-day="'+k+'"]');if(!el)return;
      var dt=el.closest('details');if(dt)dt.open=true;
      el.scrollIntoView({behavior:'smooth',block:'center'});
      el.classList.add('flash');setTimeout(function(){el.classList.remove('flash');},1800);
    }
    function one(r,past){
      var title=pick(r[2],r[6]),memo=pick(r[3],r[7]);
      var h='<div class="ev'+(past?' past':'')+'" data-day="'+esc(r[0])+'"><div class="d">'+esc(r[0])+(r[1]?'　'+esc(r[1]):'')+'</div><div class="t">'+esc(title)+'</div>';
      if(memo)h+='<div class="m">'+esc(memo)+'</div>';
      if(r[5]&&okPath(r[5]))h+='<img class="fl" loading="lazy" src="'+esc(r[5])+'" alt="'+esc(title)+'" data-src="'+esc(r[5])+'">';
      if(r[4]&&okUrl(r[4]))h+='<div class="m"><a href="'+esc(r[4])+'" target="_blank" rel="noopener">'+t('more')+'</a></div>';
      return h+'</div>';
    }
    var up=ev.filter(function(r){return r[0]>=key;}),pa=ev.filter(function(r){return r[0]<key;}).reverse();
    var html=up.length?up.map(function(r){return one(r,false);}).join(''):'<p class="empty">'+t('noEv')+'</p>';
    if(pa.length)html+='<details><summary>'+t('past').replace('%n',pa.length)+'</summary>'+pa.map(function(r){return one(r,true);}).join('')+'</details>';
    var nx=up.length?up[0][0]:key;
    cal.y=+nx.slice(0,4);cal.m=+nx.slice(5,7)-1;
    box.innerHTML='<div id="cal"></div>'+html;zoom(box,'img.fl');
    drawCal();
    document.getElementById('cal').addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      if(b.getAttribute('data-n')){cal.m+=+b.getAttribute('data-n');if(cal.m<0){cal.m=11;cal.y--;}if(cal.m>11){cal.m=0;cal.y++;}drawCal();}
      else if(b.getAttribute('data-d'))goDay(b.getAttribute('data-d'));
    });
  }
  function renderSongs(){
    var box=document.getElementById('songs-body');
    var s=rows(D.songs).filter(function(r){return r[0]&&r[1]&&okPath(r[1]);});
    if(!s.length){box.innerHTML='<p class="empty">'+t('soon')+'</p>';return;}
    box.innerHTML=s.map(function(r){
      var title=pick(r[0],r[4]),desc=pick(r[2],r[5]);
      var h='<details class="song"><summary>'+esc(title)+'</summary><div class="body">';
      if(desc)h+='<div class="m">'+esc(desc)+'</div>';
      h+='<audio controls preload="none" src="'+esc(r[1])+'"></audio>';
      h+='<div class="m"><a class="dl" href="'+esc(r[1])+'" download="'+esc(title.replace(/[\\\/:*?"<>|]/g,' '))+'.mp3">'+t('dl')+'</a></div>';
      if(r[3]&&okUrl(r[3]))h+='<div class="m"><a href="'+esc(r[3])+'" target="_blank" rel="noopener">'+t('buy')+'</a></div>';
      return h+'</div></details>';
    }).join('');
    attachDl(box);
  }
  var IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  function attachDl(box){
    if(!IOS)return;
    box.querySelectorAll('a.dl').forEach(function(a){
      var ready=null,busy=false,label=a.textContent,file=a.getAttribute('href'),name=(a.getAttribute('download')||'song.mp3');
      a.addEventListener('click',function(e){
        e.preventDefault();
        if(/Line\//i.test(navigator.userAgent)){a.textContent=t('dlLine');return;}
        if(ready){
          var f=ready;
          navigator.share({files:[f],title:name}).then(function(){ready=null;a.textContent=label;}).catch(function(err){
            ready=null;a.textContent=label;
            if(!err||err.name!=='AbortError'){a.textContent=t('dlFail');window.open(file,'_blank');}
          });
          return;
        }
        if(busy)return;busy=true;a.textContent=t('dlPrep');
        fetch(file).then(function(r){if(!r.ok)throw 0;return r.blob();}).then(function(b){
          var f=new File([b],name,{type:'audio/mpeg'});
          busy=false;
          if(navigator.canShare&&navigator.canShare({files:[f]})){ready=f;a.textContent=t('dlTap');}
          else{a.textContent=label;window.open(file,'_blank');}
        }).catch(function(){busy=false;a.textContent=t('dlFail');window.open(file,'_blank');});
      });
    });
  }
  function renderIntro(){
    var box=document.getElementById('intro-body');
    var text=pick(D.intro,D.introEn).trim();
    box.innerHTML=text?'<p class="text">'+esc(text)+'</p>':'<p class="empty">'+t('soon')+'</p>';
  }
  function renderRepertoire(){
    var box=document.getElementById('repertoire-body');
    var r=rows(D.repertoire).filter(function(x){return x[0];});
    if(!r.length){box.innerHTML='<p class="empty">'+t('soon')+'</p>';return;}
    var groups=[],map={};
    r.forEach(function(x){
      var artist=x[1]||t('repOther');
      if(!map[artist]){map[artist]={name:artist,songs:[]};groups.push(map[artist]);}
      map[artist].songs.push(x[0]);
    });
    groups.sort(function(a,b){return a.name==t('repOther')?1:b.name==t('repOther')?-1:a.name.localeCompare(b.name,'ja');});
    var html='<input type="text" class="rep-search" id="rep-search" placeholder="'+t('repSearch')+'">';
    html+='<div id="rep-list">'+groups.map(function(g){
      var isOther=g.name===t('repOther');
      return '<div class="rep-group"><h3>'+esc(g.name)+'</h3><ul>'+g.songs.map(function(s){
        var q=encodeURIComponent(isOther?s:(s+' '+g.name));
        var url='https://open.spotify.com/search/'+q;
        return '<li><a href="'+url+'" target="_blank" rel="noopener">'+esc(s)+'</a></li>';
      }).join('')+'</ul></div>';
    }).join('')+'</div>';
    html+='<p class="empty" id="rep-empty" style="display:none">'+t('repNone')+'</p>';
    box.innerHTML=html;
    var search=document.getElementById('rep-search'),empty=document.getElementById('rep-empty');
    search.addEventListener('input',function(){
      var q=search.value.trim().toLowerCase();
      var any=false;
      box.querySelectorAll('.rep-group').forEach(function(g){
        var gText=g.querySelector('h3').textContent.toLowerCase();
        var gHas=false;
        g.querySelectorAll('li').forEach(function(li){
          var show=!q||li.textContent.toLowerCase().indexOf(q)>-1||gText.indexOf(q)>-1;
          li.style.display=show?'':'none';
          if(show)gHas=true;
        });
        g.style.display=gHas?'':'none';
        if(gHas)any=true;
      });
      empty.style.display=any?'none':'';
    });
  }
  function renderPhotos(){
    var box=document.getElementById('photos-body');
    var p=rows(D.photos).filter(function(r){return r[0]&&okPath(r[0]);});
    if(!p.length){box.innerHTML='<p class="empty">'+t('soon')+'</p>';return;}
    box.innerHTML='<div class="grid">'+p.map(function(r){
      var c=pick(r[1],r[2]);
      return '<figure><img loading="lazy" src="'+esc(r[0])+'" alt="'+esc(c||t('photo'))+'" data-src="'+esc(r[0])+'">'+(c?'<figcaption>'+esc(c)+'</figcaption>':'')+'</figure>';
    }).join('')+'</div>';
    zoom(box,'img');
  }
  function render(){
    document.documentElement.lang=lang;
    document.title=t('title');
    document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t(el.getAttribute('data-t'));});
    document.querySelectorAll('#lang button').forEach(function(b){b.className=(b.getAttribute('data-l')===lang)?'on':'';});
    renderIntro();renderRepertoire();renderLinks();renderEvents();renderSongs();renderPhotos();
  }
  document.querySelectorAll('#lang button').forEach(function(b){
    b.addEventListener('click',function(){lang=b.getAttribute('data-l');try{localStorage.setItem('mina-lang',lang);}catch(e){}render();});
  });
  render();
  Promise.all([load('links.txt'),load('events.txt'),load('songs.txt'),load('photos.txt'),load('intro.txt'),load('intro-en.txt'),load('songlist.txt')]).then(function(a){
    D.links=a[0];D.events=a[1];D.songs=a[2];D.photos=a[3];D.intro=a[4];D.introEn=a[5];D.repertoire=a[6];render();
  });
})();
</script>
<script>
/* 自己紹介とイベントは常に表示。ほかは上のボタンを押すと、その下に開く(もう一度押すと閉じる) */
(function(){
  var PIN=['intro','events'];
  var secs=Array.prototype.slice.call(document.querySelectorAll('main > section'));
  var ids=secs.map(function(x){return x.id;});
  var navs=Array.prototype.slice.call(document.querySelectorAll('nav a'));
  function showTab(id,scroll,toggle){
    var cur=null;secs.forEach(function(x){if(PIN.indexOf(x.id)<0&&!x.classList.contains('tab-off'))cur=x.id;});
    var open=(PIN.indexOf(id)<0&&ids.indexOf(id)>=0&&!(toggle&&cur===id))?id:null;
    secs.forEach(function(x){if(PIN.indexOf(x.id)<0)x.classList.toggle('tab-off',x.id!==open);});
    navs.forEach(function(a){a.classList.toggle('active',a.getAttribute('href')==='#'+open);});
    if(scroll){
      var target=document.getElementById(open||(ids.indexOf(id)>=0?id:'intro'));
      var n=document.querySelector('nav'),h=n?n.offsetHeight:0;
      if(target)window.scrollTo({top:target.getBoundingClientRect().top+window.pageYOffset-h-8,behavior:'smooth'});
    }
  }
  document.addEventListener('click',function(e){
    var a=e.target.closest?e.target.closest('a[href^="#"]'):null;
    if(!a)return;
    var id=a.getAttribute('href').slice(1);
    if(ids.indexOf(id)<0)return;
    e.preventDefault();
    try{history.pushState(null,'','#'+id);}catch(x){}
    showTab(id,true,true);
  });
  window.addEventListener('popstate',function(){showTab(location.hash.slice(1),false,false);});
  showTab(location.hash.slice(1),false,false);
})();
</script>
